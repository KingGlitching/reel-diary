<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Reel Diary</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Reel%20Diary%22%2C%22short_name%22%3A%22Reel%20Diary%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%230e0f13%22%2C%22theme_color%22%3A%22%230e0f13%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Playfair+Display:ital,wght@1,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a screening-room log — sticky marquee header + tab rail; Discover is a big search desk, Library a poster wall, modal for the title card. */
:root{
  --bg:#eceef2; --paper:#f8f9fb; --ink:#14161c; --muted:#5d6372; --line:#d3d7df;
  --accent:#b4530a; --accent-ink:#fff; --chip:#e1e4ea;
  --good:#2f7a4d; --warn:#a8691a; --bad:#a3402f;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; --dstyle:normal; --dcase:uppercase; --dtrack:.02em;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f13; --paper:#17181f; --ink:#eceef3; --muted:#9aa0ad; --line:#2a2c36;
  --accent:#f2a93b; --accent-ink:#1d1203; --chip:#22242d; --good:#6cc28e; --warn:#e0a34d; --bad:#e07a68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f13; --paper:#17181f; --ink:#eceef3; --muted:#9aa0ad; --line:#2a2c36;
  --accent:#f2a93b; --accent-ink:#1d1203; --chip:#22242d; --good:#6cc28e; --warn:#e0a34d; --bad:#e07a68; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
h1,h2,h3.d,.disp{font-family:var(--display);font-weight:800;font-style:var(--dstyle);text-transform:var(--dcase);letter-spacing:var(--dtrack)}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast-in{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:34px;margin:0;line-height:1}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px;margin-top:3px}
.brand-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.palettes{display:flex;gap:6px}
.pal{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.pal[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 11px var(--mono);color:var(--muted);margin-left:5px}
button,.btn{font:600 14px var(--body);border-radius:var(--r);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:22px 14px}
.toolbar h2{font-size:30px;margin:0 auto 0 0;line-height:1}
.lede{color:var(--muted);margin:-4px 0 16px;max-width:64ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:5px 12px;border-radius:99px;font:600 13px var(--body);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chiplabel{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);font-weight:800;font-style:var(--dstyle);text-transform:var(--dcase);color:var(--ink);font-size:26px;margin:0 0 6px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.note{font-size:12px;color:var(--muted)}

/* search desk */
.desk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.searchrow{display:flex;gap:8px;flex-wrap:wrap}
.searchrow input{flex:1 1 260px;font-size:17px;padding:12px 14px}
.searchrow select{flex:0 0 auto}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{display:flex;flex-direction:column;gap:7px;min-width:0}
.card>button.pb{all:unset;cursor:pointer;display:block;border-radius:6px}
.card>button.pb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.poster{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 22px -10px rgba(0,0,0,.5);transition:transform .2s;background:var(--chip)}
.card:hover .poster{transform:translateY(-3px)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.pgen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12%;color:#fff}
.pgen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}
.ptitle{position:relative;font-family:var(--display);font-weight:800;font-style:var(--dstyle);text-transform:var(--dcase);letter-spacing:var(--dtrack);font-size:clamp(17px,1.9vw,24px);line-height:1;text-wrap:balance;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.ptitle.long{font-size:clamp(14px,1.45vw,18px)}.ptitle{overflow-wrap:anywhere;hyphens:auto}
.pyear{position:relative;font:500 11px var(--mono);opacity:.85;margin-top:6px}
.band{position:absolute;left:0;right:0;bottom:0;padding:38% 10% 10%;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.tbadge{position:absolute;top:7px;left:7px;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.fav{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.5);color:#ffd27a;border-radius:99px;font-size:12px;padding:1px 7px}
.painting{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:600 11px var(--body);border-radius:99px;padding:3px 8px;display:flex;gap:6px;align-items:center;justify-content:center;z-index:2}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.4);z-index:2}
.pbar i{display:block;height:100%;background:var(--accent)}
.ct{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cm{color:var(--muted);font-size:12.5px;margin-top:-5px}
.csum{color:var(--muted);font-size:12.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cacts{display:flex;gap:5px;flex-wrap:wrap}
.cacts .btn{padding:4px 8px;font-size:12px}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap;font-size:13px}
.stars .off{color:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);padding:3px 9px;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-watching{color:var(--accent)} .s-completed{color:var(--good)} .s-watchlist{color:var(--muted)} .s-dropped{color:var(--bad)} .s-onhold{color:var(--warn)} .s-upcoming{color:#8b5cf6}
.lmsg{font-size:13px;color:var(--muted)}
.lmsg.err{color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
.painting .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff;margin:0}
@keyframes sp{to{transform:rotate(360deg)}}

/* watching list */
.wl{display:flex;flex-direction:column;gap:12px}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.wrow .poster{width:64px;border-radius:4px}
.wrow .poster .ptitle{font-size:10px}.wrow .poster .pyear,.wrow .tbadge{display:none}
.wt{font-weight:700;font-size:16px}
.wm{color:var(--muted);font-size:13px}
.prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:8px;max-width:420px}
.prog i{display:block;height:100%;background:var(--accent)}
.wacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead .m{font-family:var(--display);font-weight:800;font-style:var(--dstyle);text-transform:var(--dcase);font-size:24px;min-width:190px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--paper);font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px;text-align:center}
.day{background:var(--paper);min-height:100px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{background:var(--bg)}.day.out .d{opacity:.4}
.day .d{font:500 12px var(--mono);color:var(--muted)}
.day.today .d{color:var(--accent-ink);background:var(--accent);border-radius:99px;width:22px;text-align:center}
.ev{all:unset;cursor:pointer;font-size:12px;line-height:1.25;padding:3px 6px;border-radius:4px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ev.start{background:none!important;color:var(--ink);border:1px dashed var(--muted)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:13px;margin-top:10px;flex-wrap:wrap}
.legend b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--accent)}
.legend b.s{background:none;border:1px dashed var(--muted)}

/* stats */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h3{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.stat{grid-column:span 3}
.stat .v{font-family:var(--display);font-weight:800;font-style:var(--dstyle);font-size:42px;line-height:1}
.stat .l{color:var(--muted);font-size:13px;margin-top:6px}
.months{grid-column:span 8}.types{grid-column:span 4}.genres{grid-column:span 6}.top{grid-column:span 6}
.bars{display:grid;grid-template-columns:24px 1fr;gap:0 8px}
.bars .yax{position:relative;height:170px;font:11px var(--mono);color:var(--muted)}
.bars .yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;height:170px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;border-bottom:1px solid var(--line)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.bar{position:relative;background:var(--accent);border-radius:3px 3px 0 0}
.bar .bv{position:absolute;top:-17px;left:0;right:0;text-align:center;font:500 11px var(--mono);color:var(--ink)}
.xlab{grid-column:2;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font:11px var(--mono);color:var(--muted);text-align:center;padding-top:5px}
.hb{display:grid;grid-template-columns:minmax(0,120px) 1fr 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.hb .tr{height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent)}
.hb .gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.toplist li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.toplist li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
dialog{border:0;border-radius:14px;padding:0;background:var(--paper);color:var(--ink);width:min(780px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(6,8,12,.6)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:3}
.mhead h3{font-family:var(--display);font-weight:800;font-style:var(--dstyle);text-transform:var(--dcase);font-size:24px;margin:0;line-height:1}
.lookup{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--chip);display:flex;flex-direction:column;gap:10px}
.ltitle{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lrow{display:flex;gap:8px;flex-wrap:wrap}.lrow input{flex:1 1 200px}
.lres{display:flex;flex-direction:column;gap:6px}
.lpick{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.lpick:hover,.lpick:focus-visible{border-color:var(--accent)}
.lpick .lt{font-weight:700}.lpick .lm{font-size:13px;color:var(--muted)}
.mbody{padding:20px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px}
.mside{display:flex;flex-direction:column;gap:9px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.flabel{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gpick{display:flex;flex-wrap:wrap;gap:5px}
.gpick .chip{padding:4px 10px;font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.rate{display:flex;gap:2px;align-items:center}
.rate button{all:unset;cursor:pointer;font-size:24px;color:var(--line);line-height:1}
.rate button.on{color:var(--accent)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:8px;align-items:flex-start}.qrow textarea{flex:1;min-height:46px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper);flex-wrap:wrap;z-index:3}
.mfoot .left{margin-right:auto;display:flex;gap:8px;align-items:center}
.confirmdel{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}

/* import */
.ibody{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.isrc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.isrc button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px;background:var(--paper)}
.isrc button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.isrc .sn{font-weight:700}.isrc .sd{font-size:12px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.irows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:52vh;overflow-y:auto}
.irow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .it{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .im{font-size:12px;color:var(--muted)}
.irow select{padding:5px 6px;font-size:13px}
.tag{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}

/* screenshot cropper */
.cbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.cstage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;line-height:0;overflow:hidden;border-radius:6px}
.cstage img{display:block;max-width:100%;max-height:58vh;pointer-events:none}
.crect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
.crect .ch{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize;touch-action:none}
.ithumb{width:30px;height:45px;object-fit:cover;border-radius:3px;flex:none;cursor:pointer;border:0;padding:0;background:none}
.ithumb img{width:30px;height:45px;object-fit:cover;border-radius:3px;display:block}
.ithumb.off img{opacity:.25;filter:grayscale(1)}

@media (max-width:900px){.stat{grid-column:span 6}.months,.types,.genres,.top{grid-column:1/-1}}
@media (max-width:620px){
  .wrap,.mast-in{padding-inline:16px}
  .brand h1{font-size:28px}
  .mbody{grid-template-columns:1fr}
  .mside{flex-direction:row;align-items:flex-start}
  .mside .poster{width:110px;flex:none}
  .fields{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px}
  .wrow{grid-template-columns:52px minmax(0,1fr)}
  .wrow .poster{width:52px}
  .wacts{grid-column:1/-1;justify-content:flex-start}
  .day{min-height:66px;padding:3px}.ev{font-size:10px;padding:2px 3px}
  .calhead .m{min-width:0;font-size:19px}
  .isrc{grid-template-columns:1fr 1fr}

  const map=[["netflix","Netflix"],["prime video","Prime Video"],["amazon","Prime Video"],["disney","Disney+"],["hbo","Max"],["max","Max"],["hulu","Hulu"],["apple","Apple TV+"],["crunchyroll","Crunchyroll"],["paramount","Paramount+"],["peacock","Peacock"],["youtube","YouTube"]];

/* ================= data sources ================= */
// --- TVmaze (TV shows, K-dramas, reality, docuseries)
function tvType(s){const lang=(s.language||"").toLowerCase(),cc=(s.network&&s.network.country&&s.network.country.code)||"";

  x.nextEp=n&&n.airdate?{date:n.airdate,label:n.number===1?`Season ${n.season} premieres`:`S${n.season} · E${n.number}${n.name&&!/^episode \d+$/i.test(n.name)?` “${n.name}”`:""}`}:null;

let tvIndexCache=null;
async function tvIndex(){if(tvIndexCache)return tvIndexCache;const pages=[0,1,2,3,4,280,300,320,330,340];
  const res=await Promise.allSettled(pages.map(p=>getJSON("https://api.tvmaze.com/shows?page="+p)));

async function tvBrowse(genre,type){const all=await tvIndex();const def=genre?GENRE_DEFS[genre][0]:"*";if(genre&&!def)return [];

  return out.sort((a,b)=>(b.weight-a.weight)||((b.rating10||0)-(a.rating10||0))).slice(0,24)}
async function tvPremieres(days=14){const dates=[];for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()+i);dates.push(isoOf(d))}
  const urls=dates.flatMap(d=>[`https://api.tvmaze.com/schedule/web?date=${d}`,`https://api.tvmaze.com/schedule?country=US&date=${d}`]);const out=new Map();
  for(let i=0;i<urls.length;i+=6){const res=await Promise.allSettled(urls.slice(i,i+6).map(u=>getJSON(u)));
    res.forEach(r=>{if(r.status!=="fulfilled")return;r.value.forEach(ep=>{const s=ep.show||(ep._embedded&&ep._embedded.show);if(!s||ep.number!==1||!s.image)return;const cc=(s.network&&s.network.country&&s.network.country.code)||(s.webChannel&&s.webChannel.country&&s.webChannel.country.code)||"";if(cc&&!["US","KR","JP"].includes(cc))return;
      const x=fromTvmaze(s);x.releaseDate=ep.airdate;x.nextEp={date:ep.airdate,label:`Season ${ep.season} premieres`};x.seasonLabel=ep.season>1?`Season ${ep.season}`:"New series";
      const k=x.srcId;if(!out.has(k)||out.get(k).releaseDate>x.releaseDate)out.set(k,x)})});await sleep(450)}

// --- AniList (anime)
const AL_FIELDS=`id title{english romaji native} coverImage{extraLarge large color} episodes duration format status startDate{year month day} genres tags{name rank} averageScore popularity description(asHtml:false) nextAiringEpisode{airingAt episode} externalLinks{site type} seasonYear`;
async function anilist(query,variables){const j=await getJSON("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query,variables})});if(j.errors)throw new Error(j.errors[0].message);return j.data}
function fromAnilist(m){const sd=m.startDate||{};const date=sd.year&&sd.month&&sd.day?`${sd.year}-${pad(sd.month)}-${pad(sd.day)}`:"";
  const g=[...new Set([...(m.genres||[]).map(normGenre),...((m.tags||[]).filter(t=>t.rank>=70).map(t=>t.name==="Isekai"?"Isekai":t.name==="Historical"?"Historical":null))].filter(Boolean))];

    summary:shortText(m.description),episodes:movie?"":(m.episodes||""),episodeLength:movie?"":(m.duration||""),runtime:movie?(m.duration||""):"",
    where:stream.includes("Crunchyroll")?"Crunchyroll":(stream[0]||""),showStatus:m.status,
    releaseDate:m.status==="NOT_YET_RELEASED"&&date?date:"",releaseHint:m.status==="NOT_YET_RELEASED"&&!date&&sd.year?(sd.month?new Date(sd.year,sd.month-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}):String(sd.year)):"",
    nextEp:m.nextAiringEpisode?{date:isoOf(new Date(m.nextAiringEpisode.airingAt*1000)),label:`Episode ${m.nextAiringEpisode.episode}`}:null,
    format:m.format,popularity:m.popularity||0}}
async function animeSearch(q){const d=await anilist(`query($q:String){Page(perPage:10){media(search:$q,type:ANIME,isAdult:false,sort:SEARCH_MATCH){${AL_FIELDS}}}}`,{q});return d.Page.media.map(fromAnilist)}
async function animeDetails(id){const d=await anilist(`query($id:Int){Media(id:$id){${AL_FIELDS}}}`,{id:+id});return fromAnilist(d.Media)}
async function animeBrowse(genre){const def=genre?GENRE_DEFS[genre][1]:null;if(genre&&!def)return [];const v={};let filt="",decl="";
  if(def&&def.startsWith("tag:")){filt=",tag_in:[$t]";v.t=def.slice(4);decl="($t:String)"}else if(def){filt=",genre_in:[$g]";v.g=def;decl="($g:String)"}
  const d=await anilist(`query${decl}{Page(perPage:24){media(type:ANIME,isAdult:false,sort:POPULARITY_DESC${filt}){${AL_FIELDS}}}}`,v);return d.Page.media.map(fromAnilist)}
async function animeUpcoming(genre){const def=genre?GENRE_DEFS[genre][1]:null;if(genre&&!def)return [];const v={};let filt="",decl="";
  if(def&&def.startsWith("tag:")){filt=",tag_in:[$t]";v.t=def.slice(4);decl="($t:String)"}else if(def){filt=",genre_in:[$g]";v.g=def;decl="($g:String)"}
  const d=await anilist(`query${decl}{Page(perPage:20){media(type:ANIME,isAdult:false,status:NOT_YET_RELEASED,sort:POPULARITY_DESC${filt}){${AL_FIELDS}}}}`,v);
  return d.Page.media.map(fromAnilist).sort((a,b)=>(a.releaseDate||"9999").localeCompare(b.releaseDate||"9999"))}

// --- Wikipedia + Wikidata (movies, documentaries, specials)
const WP="https://en.wikipedia.org/w/api.php?format=json&origin=*&";
const FILMISH=/\b(film|movie|documentary|stand-?up|comedy special|concert film)\b/i;
const NOT_FILM=/\b(music of|series|season|episode|soundtrack|album|song|novel|book|video game|character|franchise|list of|accolades|television)\b/i;
function filmType(desc,title){desc=desc||"";if(/stand-?up|comedy special/i.test(desc))return "Stand-up";if(/documentary/i.test(desc))return "Documentary";
  if(/japanese animated|anime film/i.test(desc))return "Anime";if(/animated/i.test(desc))return "Animation";return "Movie"}
function cleanFilmTitle(t){return t.replace(/\s*\((?:\d{4}\s+)?(?:[A-Za-z]+\s+)?(?:film|movie)\)\s*$/i,"").replace(/\s*\(\d{4}\)\s*$/,"")}
function fromWikiPage(p){const desc=p.description||"";const ym=(desc.match(/\b(18|19|20)\d{2}\b/)||p.title.match(/\((\d{4})/)||[])[0];
  const th=p.thumbnail&&p.thumbnail.source;
  return {src:"wiki",srcId:p.pageprops&&p.pageprops.wikibase_item||p.title,qid:p.pageprops&&p.pageprops.wikibase_item||"",wikiTitle:p.title,title:cleanFilmTitle(p.title),
    type:filmType(desc,p.title),year:ym?+String(ym).replace(/\D/g,"").slice(0,4):"",genres:[],poster:th||"",posterLg:th||"",summary:shortText(p.extract||desc,220),desc}}
async function wikiPages(params){const j=await getJSON(WP+params);const pages=Object.values((j.query&&j.query.pages)||{});return pages.sort((a,b)=>(a.index||0)-(b.index||0))}
const WIKI_PROPS="prop=pageimages|description|pageprops|extracts&piprop=thumbnail&pithumbsize=500&pilicense=any&ppprop=wikibase_item&exintro=1&explaintext=1&exsentences=2&exlimit=max";
async function movieSearch(q){const runs=await Promise.allSettled([wikiPages(`action=query&generator=search&gsrlimit=10&gsrsearch=${encodeURIComponent(q+" film")}&${WIKI_PROPS}`),wikiPages(`action=query&generator=search&gsrlimit=6&gsrsearch=${encodeURIComponent(q)}&${WIKI_PROPS}`)]);
  const seen=new Set(),out=[];runs.forEach(r=>{if(r.status!=="fulfilled")return;r.value.forEach(p=>{if(seen.has(p.title))return;seen.add(p.title);if(!FILMISH.test(p.description||"")||NOT_FILM.test(p.description||""))return;out.push(fromWikiPage(p))})});

function parseFilmList(html,year){const doc=new DOMParser().parseFromString(html,"text/html");const out=[];const MN=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

function vCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth();const first=new Date(y,m,1),sd=first.getDay(),days=new Date(y,m+1,0).getDate();const start=new Date(y,m,1-sd);const cells=Math.ceil((sd+days)/7)*7;const t=todayISO();
  const fin={},rel={},nx={};items.forEach(x=>{if(x.finishDate)(fin[x.finishDate]=fin[x.finishDate]||[]).push(x);if(x.releaseDate&&x.status==="upcoming")(rel[x.releaseDate]=rel[x.releaseDate]||[]).push(x);if(x.nextEp&&x.nextEp.date&&x.status!=="dropped")(nx[x.nextEp.date]=nx[x.nextEp.date]||[]).push(x)});
  const mk=`${y}-${pad(m+1)}`;const done=items.filter(x=>(x.finishDate||"").startsWith(mk));let html="";

function minutesOf(x){if(isSeries(x)){const per=+x.episodeLength||EP_DEFAULT[x.type]||40;const eps=x.status==="completed"?(+x.episodes||+x.watchedEps||0):(+x.watchedEps||0);return eps*per}return x.status==="completed"?(+x.runtime||110)*(1+(+x.rewatches||0)):0}

  const mc=Array(12).fill(0);yearDone.forEach(x=>mc[+x.finishDate.slice(5,7)-1]++);const mx=Math.max(4,...mc);const step=mx<=6?2:mx<=12?4:Math.ceil(mx/4);const top=Math.ceil(mx/step)*step;const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);

   <div class="panel top"><h3>Highest rated</h3>${topR.length?`<ul class="toplist">${topR.map(x=>`<li><span>${esc(x.title)} <span class="lmsg">· ${esc(x.type)}</span></span>${stars(x.rating)}</li>`).join("")}</ul>`:'<div class="lmsg">Rate what you watch to build this list.</div>'}</div></div>

function readForm(){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};const x=draft;if(!x)return;const t=g("f-title");if(t!==undefined)x.title=t.trim();
  [["f-type","type"],["f-status","status"],["f-service","service"],["f-summary","summary"],["f-review","review"],["f-start","startDate"],["f-finish","finishDate"],["f-release","releaseDate"]].forEach(([id,k])=>{const v=g(id);if(v!==undefined)x[k]=v});
  [["f-year","year"],["f-seasons","seasons"],["f-eps","episodes"],["f-weps","watchedEps"],["f-eplen","episodeLength"],["f-runtime","runtime"],["f-rew","rewatches"]].forEach(([id,k])=>{const v=g(id);if(v!==undefined)x[k]=v===""?"":Math.max(0,+v)});
  const fav=document.getElementById("f-fav");if(fav)x.favorite=fav.checked;document.querySelectorAll("[data-q]").forEach(e=>x.quotes[+e.dataset.q]=e.value);const fq=g("f-find");if(fq!==undefined)lookQ=fq}
function applyResult(x,r){["src","srcId","qid","wikiTitle","title","original","type","summary","poster","posterLg","nextEp","releaseHint"].forEach(k=>{if(r[k]!==undefined&&r[k]!=="")x[k]=r[k]});
  if(+r.year)x.year=+r.year;if(r.genres&&r.genres.length)x.genres=r.genres;["runtime","seasons","episodes","episodeLength"].forEach(k=>{if(+r[k]>0)x[k]=Math.round(+r[k])});
  if(r.where&&!x.service)x.service=r.where;if(r.releaseDate)x.releaseDate=r.releaseDate;if(r.color&&!x.colorPicked)x.color=r.color;delete x.noMatch;return x}
function saveDraft(){readForm();const x=draft;if(!x.title){const t=$("#f-title");t.focus();t.style.borderColor="var(--bad)";toast("Add a title to save");return}
  if(x.status==="completed"&&!x.finishDate)x.finishDate=todayISO();if(x.status==="watching"&&!x.startDate)x.startDate=todayISO();if(x.status==="completed"&&isSeries(x)&&+x.episodes)x.watchedEps=+x.episodes;
  const isNew=x._new;const out={...x,quotes:x.quotes.filter(q=>q&&q.trim())};delete out._new;saveItem(out);$("#dlg").close();toast(isNew?"Added to your library":"Saved")}
async function findInEditor(){readForm();lookQ=lookQ.trim();if(!lookQ)return;const ty=$("#f-ftype")?.value||"all";look={status:"busy",msg:"Searching…",items:[]};drawEditor();
  const g=await runSearch(lookQ,ty);look={status:"results",items:g.flatMap(x=>x.items).map((x,j)=>({x,j,sc:matchScore(x,lookQ)})).sort((a,b)=>b.sc-a.sc||a.j-b.j).map(o=>o.x).slice(0,12)};if($("#dlg").open)drawEditor()}
async function pickResult(i){const r=look.items[i];if(!r)return;readForm();look={status:"busy",msg:`Getting details for “${r.title}”…`,items:look.items};drawEditor();
  const d=await details(r);applyResult(draft,d);if(draft._new&&isUpcoming(d))draft.status="upcoming";look={status:"done",msg:`Filled in “${d.title}”. Check the details, then tap ${draft._new?"Add title":"Save"}.`,items:[]};drawEditor()}
function shrinkToDataURL(file,max=420){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ================= search orchestration ================= */
function matchScore(x,q){const n=norm(q),t=norm(x.title),o=norm(x.original||"");if(!n)return 0;if(t===n||o===n)return 4;if(t.startsWith(n)||o.startsWith(n))return 3;if(t.includes(n)||o.includes(n))return 2;return n.split(" ").every(w=>t.includes(w))?1:0}
async function runSearch(q,type){const srcs=sourcesFor(type);const jobs={movies:()=>movieSearch(q),tv:()=>tvSearch(q),anime:()=>animeSearch(q)};
  const res=await Promise.allSettled(srcs.map(s=>jobs[s]()));
  return srcs.map((s,i)=>{let xs=res[i].status==="fulfilled"?res[i].value:[];
    if(s==="tv"&&srcs.includes("anime"))xs=xs.filter(x=>x.type!=="Anime");
    if(type!=="all")xs=xs.filter(x=>x.type===type||(type==="Documentary"&&x.type==="Documentary"));
    xs=xs.map((x,j)=>({x,j,sc:matchScore(x,q)})).sort((a,b)=>b.sc-a.sc||a.j-b.j).map(o=>o.x);
    return {key:s,label:SECTIONS[s],items:xs.slice(0,12),failed:res[i].status!=="fulfilled",best:xs.length?matchScore(xs[0],q):-1}}).sort((a,b)=>b.best-a.best)}
async function runDisc(mode){disc.q=$("#dq")?.value?.trim()||disc.q;if(mode==="search"&&!disc.q){$("#dq")?.focus();return}
  disc.status="busy";disc.mode=mode;const tl=disc.type==="all"?"":disc.type+" ";
  disc.msg=mode==="search"?`Searching for “${disc.q}”…`:mode==="soon"?"Finding upcoming movies, premieres and anime… (this can take a few seconds)":"Finding popular titles… (this can take a few seconds)";render();
  try{let groups;const srcs=sourcesFor(disc.type);
    if(mode==="search")groups=await runSearch(disc.q,disc.type);
    else{const jobs=mode==="soon"?{movies:()=>movieUpcoming(disc.genre),tv:()=>tvPremieres(14),anime:()=>animeUpcoming(disc.genre)}
        :{movies:()=>movieBrowse(disc.genre,mode==="recent"),tv:()=>tvBrowse(disc.genre,disc.type),anime:()=>mode==="recent"?animeBrowseRecent(disc.genre):animeBrowse(disc.genre)};
      const res=await Promise.allSettled(srcs.map(s=>jobs[s]()));
      groups=srcs.map((s,i)=>{let xs=res[i].status==="fulfilled"?res[i].value:[];if(s==="tv"&&disc.genre&&mode==="soon")xs=xs.filter(x=>(x.genres||[]).includes(disc.genre));if(s==="tv"&&srcs.includes("anime"))xs=xs.filter(x=>x.type!=="Anime");if(disc.type!=="all")xs=xs.filter(x=>x.type===disc.type);
        if(mode==="recent"&&s==="tv"){const cut=String(new Date().getFullYear()-5);xs=xs.filter(x=>String(x.year)>=cut)}
        return {key:s,label:SECTIONS[s]+(mode==="soon"&&s==="tv"?" · premieres in the next 2 weeks":""),items:xs,failed:res[i].status!=="fulfilled",note:mode==="soon"&&s==="movies"?"US releases announced on Wikipedia; dates can move":""}})}
    disc.groups=groups;disc.status="results";
    disc.msg=mode==="search"?`Results for “${disc.q}”`:mode==="soon"?`Coming soon${disc.genre?" · "+disc.genre:""}${tl?" · "+tl.trim():""}`:`${mode==="recent"?"Recent hits":"Popular"}${disc.genre?" · "+disc.genre:""}${tl?" · "+tl.trim():""}`}
  catch(e){console.warn(e);disc.status="error";disc.msg="Couldn't reach the movie databases. Check your internet connection and try again."}
  if(tab==="discover")render()}
async function animeBrowseRecent(genre){const def=genre?GENRE_DEFS[genre][1]:null;if(genre&&!def)return [];const v={y:(new Date().getFullYear()-3)*10000};let filt="",decl="($y:FuzzyDateInt";
  if(def&&def.startsWith("tag:")){filt=",tag_in:[$t]";v.t=def.slice(4);decl+=",$t:String"}else if(def){filt=",genre_in:[$g]";v.g=def;decl+=",$g:String"}
  const d=await anilist(`query${decl}){Page(perPage:24){media(type:ANIME,isAdult:false,sort:POPULARITY_DESC,startDate_greater:$y${filt}){${AL_FIELDS}}}}`,v);return d.Page.media.map(fromAnilist)}
async function addFromResult(r,status){const d=await details(r);const x=applyResult(blank({quotes:[]}),d);x.status=status;
  if(status==="watching")x.startDate=todayISO();if(status==="completed"){x.finishDate=todayISO();if(isSeries(x)&&+x.episodes)x.watchedEps=+x.episodes}
  saveItem(x);toast(`“${x.title}” added to ${SLABEL[status]}`)}

/* ================= background refresh + poster finding ================= */
async function refreshItems(force){const xs=items.filter(x=>x.src&&x.src!=="custom"&&["watching","upcoming","watchlist","onhold"].includes(x.status)&&(force||!x.checkedAt||Date.now()-new Date(x.checkedAt)>20*3600e3)).slice(0,40);
  if(!xs.length){if(force)toast("Everything is up to date");return}if(force)toast(`Checking ${xs.length} title${xs.length>1?"s":""} for new dates…`);let changed=0;
  for(const x of xs){try{const d=x.src==="tvmaze"?await tvDetails(x.srcId):x.src==="anilist"?await animeDetails(x.srcId):x.src==="wiki"?await movieDetails(x):null;
      if(d){const cur=items.find(y=>y.id===x.id);if(!cur)continue;const before=JSON.stringify([cur.nextEp,cur.releaseDate,cur.episodes]);
        cur.nextEp=d.nextEp||null;if(d.releaseDate)cur.releaseDate=d.releaseDate;else if(cur.status!=="upcoming"&&cur.releaseDate&&!isUpcoming(cur)){}
        if(+d.episodes>(+cur.episodes||0))cur.episodes=d.episodes;if(+d.seasons>(+cur.seasons||0))cur.seasons=d.seasons;if(!cur.poster&&d.poster){cur.poster=d.poster;cur.posterLg=d.posterLg}
        cur.checkedAt=new Date().toISOString();if(JSON.stringify([cur.nextEp,cur.releaseDate,cur.episodes])!==before)changed++}}catch(e){console.warn(e)}await sleep(x.src==="wiki"?150:400)}
  persist();render();if(force)toast(changed?`Updated ${changed} title${changed>1?"s":""}`:"No new dates yet")}
async function findPosters(){if(posterJob.running)return;const xs=items.filter(x=>!x.poster&&!x.customPoster&&!x.noMatch);if(!xs.length)return;posterJob={running:true,done:0,total:xs.length};render();
  for(const x of xs){const m=await bestMatch(x);const cur=items.find(y=>y.id===x.id);if(cur){if(m){const keep={status:cur.status,rating:cur.rating,watchedEps:cur.watchedEps,finishDate:cur.finishDate,startDate:cur.startDate,review:cur.review,rewatches:cur.rewatches,service:cur.service,type:cur.type};
        applyResult(cur,m);Object.assign(cur,Object.fromEntries(Object.entries(keep).filter(([k,v])=>v!==""&&v!==undefined&&v!==0)));if(!cur.service&&m.where)cur.service=m.where}else cur.noMatch=true}
    posterJob.done++;if(posterJob.done%3===0){persist();render()}await sleep(350)}
  posterJob.running=false;persist();render();toast("Finished finding posters")}

/* ================= import ================= */
let imp={src:"letterboxd",status:"idle",items:[],msg:""};
function parseCSV(t){const rows=[];let row=[],f="",q=false;t=t.replace(/^﻿/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(v=>v!==""))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(v=>v!==""))rows.push(row);return rows}
function parseLetterboxd(text){const rows=parseCSV(text);if(rows.length<2)return null;const h=rows[0].map(s=>s.trim().toLowerCase());const c=n=>h.indexOf(n);if(c("name")<0||!h.some(s=>s.includes("letterboxd")))return null;const map=new Map();
  rows.slice(1).forEach(r=>{const title=(r[c("name")]||"").trim();if(!title)return;const year=+(r[c("year")]||0)||"";const k=norm(title)+"|"+year;const date=(c("watched date")>=0&&r[c("watched date")])||(c("date")>=0&&r[c("date")])||"";const rating=c("rating")>=0?+r[c("rating")]||0:0;
    const e=map.get(k)||{title,year,type:"Movie",status:"completed",rating:0,finishDate:"",rewatches:-1};e.rewatches++;if(rating)e.rating=Math.min(5,Math.round(rating));const d=isoOf(date.replace(/-/g,"/"));if(d&&d>e.finishDate)e.finishDate=d;if(c("review")>=0&&r[c("review")])e.review=r[c("review")];map.set(k,e)});
  return [...map.values()].map(e=>({...e,rewatches:Math.max(0,e.rewatches)}))}
function parseMAL(text){const doc=new DOMParser().parseFromString(text,"application/xml");const an=[...doc.getElementsByTagName("anime")];if(!an.length)return null;const g=(n,t)=>(n.getElementsByTagName(t)[0]?.textContent||"").trim();
  const sm={"completed":"completed","watching":"watching","plan to watch":"watchlist","on-hold":"onhold","dropped":"dropped"};const dd=s=>s&&!/^0000/.test(s)?s.replace(/-00/g,"-01"):"";
  return an.map(n=>{const st=sm[g(n,"my_status").toLowerCase()]||"watchlist";const sc=+g(n,"my_score")||0;return {title:g(n,"series_title"),type:"Anime",status:st,rating:sc?Math.max(1,Math.round(sc/2)):0,episodes:+g(n,"series_episodes")||"",watchedEps:+g(n,"my_watched_episodes")||"",startDate:dd(g(n,"my_start_date")),finishDate:st==="completed"?dd(g(n,"my_finish_date")):"",rewatches:+g(n,"my_times_watched")||0,review:g(n,"my_comments")}}).filter(x=>x.title)}
function parseNetflix(text){const rows=parseCSV(text);if(rows.length<2)return null;const h=rows[0].map(s=>s.trim().toLowerCase());const ti=h.indexOf("title"),di=h.findIndex(s=>s==="date"||s==="start time");if(ti<0||di<0)return null;const map=new Map();
  rows.slice(1).forEach(r=>{const raw=(r[ti]||"").trim();if(!raw)return;const d=isoOf((r[di]||"").replace(/-/g,"/").slice(0,10))||isoOf(r[di]);const parts=raw.split(": ");const isEp=parts.length>1&&/(season|series|episode|chapter|part|volume|limited|collection|book)\b/i.test(parts.slice(1).join(" "));
    const title=isEp?parts[0]:raw;const k=norm(title);const e=map.get(k)||{title,type:isEp?"TV Show":"Movie",eps:new Set(),first:d,last:d};if(isEp)e.eps.add(parts.slice(1).join(": "));if(d&&(!e.first||d<e.first))e.first=d;if(d&&d>e.last)e.last=d;map.set(k,e)});
  return [...map.values()].map(e=>({title:e.title,type:e.type,service:"Netflix",watchedEps:e.eps.size||"",status:e.type==="Movie"?"completed":"watching",startDate:e.type==="Movie"?"":e.first,finishDate:e.type==="Movie"?e.last:""}))}
function parseBackup(text){try{const j=JSON.parse(text);if(j&&j.app==="reel-diary"&&Array.isArray(j.items))return j.items;if(Array.isArray(j)&&j[0]&&j[0].title)return j}catch(e){}return null}
async function importFile(file){imp.status="busy";imp.msg="Reading "+file.name+"…";drawImport();
  try{const text=await file.text();let xs=null;
    if(/^\s*[\[{]/.test(text)){const b=parseBackup(text);if(b){restoreBackup(b);return}}
    if(/<myanimelist|<anime>/i.test(text.slice(0,5000)))xs=parseMAL(text);else if(/letterboxd/i.test(text.slice(0,600)))xs=parseLetterboxd(text);else xs=parseNetflix(text);
    if(!xs||!xs.length){imp.status="error";imp.msg="No titles found in that file. Check it's the export file named in the steps above.";drawImport();return}
    imp.items=xs.map(x=>({...x,pick:true,existing:(findLib(x)||{}).id||null}));imp.status="review";drawImport()}catch(e){console.warn(e);imp.status="error";imp.msg="Couldn't read that file. Try exporting it again.";drawImport()}}
function restoreBackup(list){let n=0,m=0;list.forEach(x=>{if(!x||!x.title)return;const ex=items.find(y=>y.id===x.id)||findLib(x);if(ex){Object.assign(ex,x,{id:ex.id});m++}else{items.push({...blank(),...x,id:x.id||uid()});n++}});persist();$("#imp").close();tab="library";render();toast(`Restored ${n} title${n===1?"":"s"}${m?`, updated ${m}`:""}`)}
function runImport(){const sel=imp.items.filter(x=>x.pick);let n=0,m=0;sel.forEach(x=>{const c={...x};delete c.pick;delete c.existing;const ex=x.existing&&items.find(y=>y.id===x.existing);
    if(ex){Object.entries(c).forEach(([k,v])=>{if((ex[k]===undefined||ex[k]===""||ex[k]===0)&&v!==""&&v!==undefined)ex[k]=v});if(ex.status==="watchlist"&&c.status!=="watchlist")ex.status=c.status;m++}
    else{items.push(blank({...c,quotes:[],genres:[],updatedAt:new Date().toISOString()}));n++}});
  persist();$("#imp").close();tab="library";render();toast(`Imported ${n} new title${n===1?"":"s"}${m?`, updated ${m}`:""}. Finding posters now…`,4000);findPosters()}
function exportBackup(){const blob=new Blob([JSON.stringify({app:"reel-diary",version:1,exportedAt:new Date().toISOString(),items},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`reel-diary-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Backup saved to your downloads")}
function openImport(){imp={src:imp.src,status:"idle",items:[],msg:""};drawImport();if(!$("#imp").open)$("#imp").showModal()}
function drawImport(){
  if(imp.status==="review"){const sel=imp.items.filter(x=>x.pick).length;
    $("#imp").innerHTML=`<div class="mhead"><h3>Review import</h3><button type="button" class="btn ghost" data-act="iclose" aria-label="Close">✕</button></div><div class="ibody"><div class="lmsg">Found ${imp.items.length} title${imp.items.length===1?"":"s"}. Untick anything you don't want and fix the category or status if needed. Posters and details are added automatically after you import.</div>
    <div class="irows">${imp.items.map((x,i)=>`<div class="irow"><input type="checkbox" id="ip-${i}" data-ipick="${i}" ${x.pick?"checked":""} aria-label="Import ${esc(x.title)}"><label for="ip-${i}" style="min-width:0"><div class="it">${esc(x.title)}${x.existing?'<span class="tag">in library · will merge</span>':""}</div><div class="im">${esc([x.year,x.watchedEps?x.watchedEps+(x.watchedEps==1?" episode":" episodes")+" watched":"",x.finishDate?"watched "+fmtD(x.finishDate):"",+x.rating?x.rating+"★":""].filter(Boolean).join(" · "))}</div></label>
      <select data-itype="${i}" aria-label="Category">${TYPES.map(t=>`<option ${x.type===t?"selected":""}>${t}</option>`).join("")}</select><select data-istat="${i}" aria-label="Status">${STATUSES.map(([k,l])=>`<option value="${k}" ${x.status===k?"selected":""}>${l}</option>`).join("")}</select></div>`).join("")}</div></div>
    <div class="mfoot"><div class="left"><button type="button" class="btn sm ghost" data-act="iback">Start over</button></div><button type="button" class="btn" data-act="iclose">Cancel</button><button type="button" class="btn primary" data-act="irun" ${sel?"":"disabled"}>Import ${sel}</button></div>`;return}
  const S={letterboxd:["Letterboxd","Movies you've logged"],mal:["MyAnimeList","Your anime list"],netflix:["Netflix","Viewing history"],backup:["Backup","Move or restore"]};
  const G={letterboxd:`<ol class="steps"><li>On <b>letterboxd.com</b>, go to <b>Settings</b> → <b>Data</b> → <b>Export your data</b>.</li><li>Unzip the download and pick <b>diary.csv</b> (or <b>watched.csv</b> / <b>ratings.csv</b>).</li><li>Choose it below. Ratings, watch dates and rewatches come across, and posters are found for you.</li></ol>`,
    mal:`<ol class="steps"><li>On <b>myanimelist.net</b>, open the menu → <b>Export</b>.</li><li>Choose <b>Anime List</b> and export, then unzip the .gz file to get an <b>.xml</b> file.</li><li>Choose the .xml below.</li></ol>`,
    netflix:`<ol class="steps"><li>On <b>netflix.com</b>, go to <b>Account</b> → <b>Profiles</b> → your profile → <b>Viewing activity</b>.</li><li>Scroll down and tap <b>Download all</b> to get <b>NetflixViewingHistory.csv</b>.</li><li>Choose it below. Episodes are grouped into shows.</li></ol>`,
    backup:`<p class="lede" style="margin:0">Reel Diary saves on this device. Save a backup file to keep your library safe or to move it to another phone or browser, then restore it there.</p><div><button type="button" class="btn" data-act="export">Save a backup file</button></div><p class="lmsg" style="margin:0">To restore, choose a backup file below.</p>`};
  const busy=imp.status==="busy"?`<div class="lmsg"><span class="spin"></span>${esc(imp.msg)}</div>`:imp.status==="error"?`<div class="lmsg err">${esc(imp.msg)}</div>`:"";
  const accept=imp.src==="mal"?".xml,text/xml,application/xml":imp.src==="backup"?".json,application/json":".csv,text/csv,text/plain";
  $("#imp").innerHTML=`<div class="mhead"><h3>Import &amp; backup</h3><button type="button" class="btn ghost" data-act="iclose" aria-label="Close">✕</button></div><div class="ibody"><div class="isrc">${Object.entries(S).map(([k,[n,d]])=>`<button type="button" data-isrc="${k}" aria-pressed="${imp.src===k}"><span class="sn">${n}</span><span class="sd">${d}</span></button>`).join("")}</div>${G[imp.src]}
    <div class="dropzone"><label class="btn primary" for="ifile">${imp.src==="backup"?"Choose backup file":"Choose file"}</label><input id="ifile" type="file" accept="${accept}" hidden>${busy}</div></div>`}

/* ================= events ================= */
document.addEventListener("click",async e=>{const t=e.target.closest("button,a.btn");if(!t)return;const ds=t.dataset;
  if(ds.pal){applyPalette(ds.pal);toast(PALETTES[ds.pal].name+" theme");return}
  if(ds.tab){tab=ds.tab;render();window.scrollTo({top:0});return}
  if(ds.act==="import"){openImport();return}
  if(t.closest("#imp")){if(ds.isrc){imp.src=ds.isrc;imp.status="idle";drawImport()}else if(ds.act==="iclose")$("#imp").close();else if(ds.act==="iback"){imp.status="idle";drawImport()}else if(ds.act==="irun")runImport();else if(ds.act==="export")exportBackup();return}
  if(ds.act==="add"&&!t.closest("dialog")){openEditor(null);return}
  if(ds.act==="add-soon"){openEditor(null);draft.status="upcoming";drawEditor();return}
  if(ds.act==="gosoon"){tab="discover";render();runDisc("soon");return}
  if(ds.act==="refresh"){refreshItems(true);return}
  if(ds.act==="findposters"){findPosters();return}
  if(ds.act==="dsearch"){runDisc("search");return}if(ds.act==="dbrowse"){runDisc("browse");return}if(ds.act==="drecent"){runDisc("recent");return}if(ds.act==="dsoon"){runDisc("soon");return}
  if(ds.dcat){disc.type=ds.dcat;disc.q=$("#dq")?.value||disc.q;render();return}
  if(ds.dgenre){disc.genre=disc.genre===ds.dgenre?"":ds.dgenre;disc.q=$("#dq")?.value||disc.q;render();return}
  if(ds.radd){const r=resultsById[ds.radd];if(!r)return;t.disabled=true;t.textContent="Adding…";try{await addFromResult(r,ds.st)}catch(err){toast("Couldn't add that. Try again.")}return}
  if(ds.rinfo){const r=resultsById[ds.rinfo];if(!r)return;const have=findLib(r);if(have){openEditor(have);return}openEditor(null);look={status:"busy",msg:`Getting details for “${r.title}”…`,items:[]};drawEditor();const d=await details(r);applyResult(draft,d);if(isUpcoming(d))draft.status="upcoming";look={status:"done",msg:"Pick a status, then tap Add title.",items:[]};drawEditor();return}
  if(ds.ltype){lib.type=ds.ltype;render();return}if(ds.lstat){lib.status=ds.lstat;render();return}if(ds.lgenre){lib.genre=ds.lgenre;render();return}
  if(ds.cal!==undefined){const n=+ds.cal;if(n===0){calCursor=new Date();calCursor.setDate(1)}else calCursor.setMonth(calCursor.getMonth()+n);render();return}
  if(ds.ep){const x=items.find(y=>y.id===ds.ep);if(!x)return;let w=Math.max(0,(+x.watchedEps||0)+(+ds.d));const tot=+x.episodes||0;if(tot)w=Math.min(w,tot);x.watchedEps=w;if(tot&&w>=tot){x.status="completed";x.finishDate=todayISO();toast(`Finished “${x.title}”! Rate it from My Library.`)}saveItem(x);return}
  if(ds.done){const x=items.find(y=>y.id===ds.done);if(!x)return;Object.assign(x,{status:"completed",finishDate:todayISO(),watchedEps:+x.episodes||x.watchedEps});saveItem(x);toast(`Marked “${x.title}” completed`);return}
  if(ds.out){const x=items.find(y=>y.id===ds.out);if(x){x.status=ds.to;if(ds.to==="watching")x.startDate=todayISO();saveItem(x);toast(`Moved “${x.title}” to ${SLABEL[ds.to]}`)}return}
  if(ds.open&&!t.closest("dialog")){const x=items.find(y=>y.id===ds.open);if(x)openEditor(x);return}
  if(!t.closest("#dlg"))return;
  if(ds.act==="close"){$("#dlg").close();return}if(ds.act==="find"){findInEditor();return}if(ds.pick!==undefined){pickResult(+ds.pick);return}
  if(ds.g){readForm();const i=draft.genres.indexOf(ds.g);i>=0?draft.genres.splice(i,1):draft.genres.push(ds.g);drawEditor();return}
  if(ds.color){readForm();draft.color=ds.color;draft.colorPicked=true;drawEditor();return}if(ds.rate!==undefined){readForm();draft.rating=+ds.rate;drawEditor();return}
  if(ds.act==="addq"){readForm();draft.quotes.push("");drawEditor();return}if(ds.rmq!==undefined){readForm();draft.quotes.splice(+ds.rmq,1);if(!draft.quotes.length)draft.quotes=[""];drawEditor();return}
  if(ds.act==="rmcustom"){readForm();draft.customPoster="";drawEditor();return}
  if(ds.act==="refreshone"){readForm();t.disabled=true;t.textContent="Refreshing…";const d=await details(draft);const keep={status:draft.status,service:draft.service,genres:draft.genres.length?draft.genres:null};applyResult(draft,d);if(keep.service)draft.service=keep.service;draft.status=keep.status;drawEditor();toast("Details refreshed. Tap Save to keep them.");return}
  if(ds.act==="del"){readForm();confirmDel=true;drawEditor();return}if(ds.act==="nodel"){readForm();confirmDel=false;drawEditor();return}
  if(ds.act==="del2"){removeItem(draft.id);$("#dlg").close();toast("Deleted");return}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="dq"){e.preventDefault();runDisc("search")}else if(e.target.id==="f-find"){e.preventDefault();findInEditor()}});
document.addEventListener("submit",e=>{if(e.target.id==="xform"){e.preventDefault();saveDraft()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="f-type"||t.id==="f-status"){readForm();drawEditor();return}if(t.id==="dtype"){disc.type=t.value;disc.q=$("#dq")?.value||disc.q;render();return}if(t.id==="lsort"){lib.sort=t.value;render();return}
  if(t.id==="ifile"&&t.files.length){importFile(t.files[0]);return}
  if(t.dataset.ipick!==undefined){imp.items[+t.dataset.ipick].pick=t.checked;drawImport();return}if(t.dataset.istat!==undefined){imp.items[+t.dataset.istat].status=t.value;return}if(t.dataset.itype!==undefined){imp.items[+t.dataset.itype].type=t.value;return}
  if(t.id==="f-cover"&&t.files[0]){readForm();try{draft.customPoster=await shrinkToDataURL(t.files[0]);drawEditor();toast("Photo added. Tap Save to keep it.")}catch(err){toast("That picture didn't load. Try another.")}}});
let qt;document.addEventListener("input",e=>{if(e.target.id==="lq"){lib.q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{const p=e.target.selectionStart;render();const n=$("#lq");if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}},180)}});
window.addEventListener("storage",e=>{if(e.key===LS){load();render()}});

/* ================= boot ================= */
load();applyPalette(settings.palette||"cinema");
try{const s=sessionStorage.getItem("reelLive.tab");if(s&&TABS.some(x=>x[0]===s))tab=s;else if(items.length)tab="library"}catch(e){}
render();
setTimeout(()=>refreshItems(false),1500);
window.__reel={items:()=>items,runDisc,details,bestMatch,movieSearch,tvSearch,animeSearch,movieUpcoming,tvPremieres,animeUpcoming,movieBrowse,tvBrowse,animeBrowse};
})();
